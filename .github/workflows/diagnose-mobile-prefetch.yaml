name: Diagnose mobile image prefetch

on:
  push:
    branches:
      - markdalgleish/diagnose-firefox-mobile-prefetch

permissions:
  contents: read

jobs:
  firefox:
    if: github.repository == 'markdalgleish/remix'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: ./.github/actions/setup-node-pnpm-cache
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps firefox
      - name: Repeat focused mobile test
        run: |
          status=0
          for attempt in {1..10}; do
            echo "Focused attempt $attempt"
            if ! pnpm --filter record-store-demo test app/prefetch.test.e2e.ts --project firefox --only 'prefetches mobile' --quiet; then
              status=1
            fi
          done
          exit "$status"
      - name: Repeat full prefetch file
        if: always()
        run: |
          status=0
          for attempt in {1..10}; do
            echo "Full-file attempt $attempt"
            if ! pnpm --filter record-store-demo test app/prefetch.test.e2e.ts --project firefox --quiet; then
              status=1
            fi
          done
          exit "$status"
